<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scenaria Viewer</title>
  <link rel="icon" href="/favicon.png" />
  <style>
    body { font-family: arial, sans-serif; margin: 12px; }
    .errorText { color: red; font-family: Courier, monospace; }
    .consoleText {
      color: black; font-family: Courier, monospace;
      overflow-y: auto; height: 100px; border: 1px solid black;
    }
    button {
      color: #090909; padding: 0.7em 1.7em; font-size: 18px; border-radius: 0.5em;
      background: #e8e8e8; border: 1px solid #e8e8e8;
      transition: all .3s;
      box-shadow: 6px 6px 12px #c5c5c5, -6px -6px 12px #ffffff;
    }
    button:active {
      color: #666;
      box-shadow: inset 4px 4px 12px #c5c5c5, inset -4px -4px 12px #ffffff;
    }
    .drawingWrap {
      height: 70vh; width: 100%; border: 1px solid black;
      overflow-y: scroll; border-radius: 6px;
    }
    scenaria-viewer { display: block; width: 100%; height: 100%; min-height: 200px; }
    .spacingInput { width: 60px; margin-left: 10px; }
  </style>
  <script type="module" src="/src/components/index.js"></script>
</head>
<body>
  <div class="drawingWrap">
    <scenaria-viewer id="viewer" spacing="20"></scenaria-viewer>
  </div>
  <hr />
  <select id="scenarioSelect" style="width:20%"></select>
  <button type="button" id="btnRun">Run Scenario</button>
  <button type="button" id="btnBack">&lt;</button>
  <button type="button" id="btnFwd">&gt;</button>
  <input type="checkbox" id="chkShowNotes" />
  <label for="chkShowNotes">Notes</label>
  <hr />
  <div id="cons" class="consoleText"></div>
  <span id="error" class="errorText"></span>
  <script type="module">
    import {
      SHOW_NOTES_ATTR,
      SCENARIA_READY_EVENT,
      SCENARIA_ERROR_EVENT
    } from '/src/components/scenaria-attrs.js'
    const STATE_PARAM = 's'
    const viewer = document.getElementById('viewer')
    const scenarioSelect = document.getElementById('scenarioSelect')
    const cons = document.getElementById('cons')
    const err = document.getElementById('error')

    function showMsg(msg) {
      cons.innerHTML += (msg || '') + '<br/>'
    }
    function showError(msg) {
      err.innerText = msg || ''
    }

    function setScenariosToSelect(scenarios) {
      if (!scenarios) throw new Error('No scenarios when setting scenarios selection')
      while (scenarioSelect.options.length > 0) scenarioSelect.remove(0)
      scenarios.forEach((scenario, ind) => {
        const opt = document.createElement('option')
        opt.value = String(ind)
        opt.innerHTML = scenario.name || `Scenario ${ind}`
        scenarioSelect.append(opt)
      })
    }

    viewer.addEventListener(SCENARIA_READY_EVENT, e => {
      setScenariosToSelect(e.detail.scenarios)
      showMsg('Model loaded.')
      showMsg('Done, from URL.')
    })
    viewer.addEventListener(SCENARIA_ERROR_EVENT, e => showError(e.detail.message))

    const params = new URLSearchParams(window.location.search)
    if (params.has(STATE_PARAM)) {
      viewer.setStateFromURL(params.get(STATE_PARAM))
    } else {
      showError('No diagram state provided in URL')
    }

    document.getElementById('btnRun').onclick = () => {
      try {
        viewer.runScenario(scenarioSelect.value, showMsg)
      } catch (e) {
        showError(e.toString())
      }
    }
    document.getElementById('btnBack').onclick = () => {
      try {
        viewer.scenarioBack(scenarioSelect.value, showMsg)
      } catch (e) {
        showError(e.toString())
      }
    }
    document.getElementById('btnFwd').onclick = () => {
      try {
        viewer.scenarioNext(scenarioSelect.value, showMsg)
      } catch (e) {
        showError(e.toString())
      }
    }
    document.getElementById('chkShowNotes').onchange = () => {
      const on = document.getElementById('chkShowNotes').checked
      viewer.setAttribute(SHOW_NOTES_ATTR, on ? 'true' : 'false')
      try {
        if (on) viewer.showNotes()
        else viewer.hideNotes()
      } catch (e) {
        showError(e.toString())
      }
    }
  </script>
</body>
</html>
